# Render Blueprint: tells Render how to build and run the site.
# Render reads this when you create the service from this repository,
# and again when you sync the Blueprint.
services:
  - type: web
    name: pivot-site
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SITE_URL
        value: https://pivotdesigns.co.uk
      # The orders database below. Render fills this in.
      - key: DATABASE_URL
        fromDatabase:
          name: pivot-orders
          property: connectionString
      # Stripe keys: Render asks for these when the Blueprint syncs. Never put them in this file.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  # Orders database, about £6 a month. Only the site can reach it (no outside access).
  - name: pivot-orders
    databaseName: pivot
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
